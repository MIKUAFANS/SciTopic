[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitopic"
version = "0.1.0"
description = "Enhancing Topic Discovery in Scientific Literature through Advanced LLM"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "GPL-3.0-or-later" }
authors = [
    { name = "Pengjiang Li" },
    { name = "Zaitian Wang" },
    { name = "Xinhao Zhang" },
]
keywords = ["topic-modeling", "llm", "scientific-literature", "embedding", "nlp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "torch>=1.10",
    "transformers>=4.20",
    "FlagEmbedding>=1.2",
    "openai>=1.0",
    "joblib>=1.1",
    "tqdm>=4.62",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
evaluation = [
    "topmost",
    "bertopic>=0.15",
    "umap-learn>=0.5",
    "hdbscan>=0.8",
    "spacy>=3.4",
    "nltk>=3.7",
    "matplotlib>=3.5",
    "wordcloud>=1.8",
    "scipy>=1.7",
    "beautifulsoup4>=4.11",
    "requests>=2.28",
    "plotly>=5.10",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "black>=23.0",
]

[project.urls]
Homepage = "https://github.com/MIKUAFANS/SciTopic"
Paper = "https://arxiv.org/pdf/2508.20514.pdf"

[project.scripts]
scitopic = "scitopic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scitopic = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
